<style>html.wisl-shop #header,html.wisl-shop .header-announcement-bar-wrapper,html.wisl-shop #footer-sections{display:none!important}</style>
<script>
(function(){
  if(!/^\/(shop|cart)(\/|$)/.test(location.pathname)) return;
  var R='https://raw.githubusercontent.com/mohamedabdulrub/unit-website-media/main/wisl-site/';
  document.documentElement.classList.add('wisl-shop');
  function add(file, tag){ fetch(R+file).then(function(r){ return r.text(); }).then(function(t){ var e=document.createElement(tag); e.textContent=t; document.head.appendChild(e); }); }
  add('shop.css','style'); add('shop.js','script');
})();
</script>
