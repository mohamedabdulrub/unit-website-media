<!-- Unit cookie banner restyle + animated cookie character. Paste into Settings > Code injection > Footer -->
<style>
.gdpr-cookie-banner.gdpr-cookie-banner{background:#FFFAF0!important;color:#2D2926!important;border:3px solid #2D2926!important;border-radius:18px!important;box-shadow:0 4px 0 #2D2926!important;padding:10px 12px 10px 60px!important;max-width:290px!important;min-height:0!important;font-family:'American Typewriter','Courier Prime','Courier New',serif!important;overflow:visible!important;animation:uCkIn .45s cubic-bezier(.2,1.4,.4,1) both}
.gdpr-cookie-banner.gdpr-cookie-banner .disclaimer-text,.gdpr-cookie-banner.gdpr-cookie-banner .disclaimer-text *{font-family:inherit!important;color:#2D2926!important;font-weight:400!important;font-size:12.5px!important;line-height:1.35!important;letter-spacing:normal!important;margin:0!important}
.gdpr-cookie-banner .u-ck-title{display:block;margin:0 0 2px;font-family:'Motter Corpus ITC TT','Motter Corpus',MOTTCI,Corben,Georgia,serif;font-weight:700;font-size:16px;line-height:1.05;text-transform:uppercase;color:#9E6950}
.gdpr-cookie-banner.gdpr-cookie-banner .button-group{margin-top:8px!important;justify-content:flex-start!important}
.gdpr-cookie-banner.gdpr-cookie-banner button,.gdpr-cookie-banner.gdpr-cookie-banner .sqs-cookie-banner-v2-cta{background:#F99814!important;color:#2D2926!important;border:2.5px solid #2D2926!important;border-radius:999px!important;box-shadow:0 3px 0 #2D2926!important;min-height:32px!important;padding:0 14px!important;font-family:'American Typewriter','Courier Prime','Courier New',serif!important;font-weight:700!important;font-size:12px!important;text-transform:uppercase!important;letter-spacing:.5px!important;transition:transform .12s ease,box-shadow .12s ease,background .12s ease!important}
.gdpr-cookie-banner.gdpr-cookie-banner button *{color:inherit!important;font:inherit!important}
.gdpr-cookie-banner.gdpr-cookie-banner button:hover{background:#FCE053!important;transform:translateY(-2px);box-shadow:0 5px 0 #2D2926!important}
.gdpr-cookie-banner .u-ck{position:absolute;left:8px;top:50%;width:48px;height:48px;margin-top:-24px;pointer-events:none}
.gdpr-cookie-banner .u-ck-bob{transform-origin:50% 90%;animation:uCkBob 2.6s ease-in-out infinite}
.gdpr-cookie-banner .u-ck-eye{transform-box:fill-box;transform-origin:center;animation:uCkBlink 4s infinite}
.gdpr-cookie-banner .u-ck-crumb{animation:uCkCrumb 2.6s ease-in infinite;opacity:0}
.gdpr-cookie-banner .u-ck-crumb.c2{animation-delay:.35s}
.gdpr-cookie-banner .u-ck-arm{transform-box:fill-box;transform-origin:10% 90%;animation:uCkWave 2.6s ease-in-out infinite}
@keyframes uCkIn{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes uCkBob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
@keyframes uCkBlink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.1)}}
@keyframes uCkCrumb{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}80%{opacity:0;transform:translate(-4px,26px)}100%{opacity:0}}
@keyframes uCkWave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-25deg)}80%{transform:rotate(10deg)}90%{transform:rotate(-20deg)}}
@media (max-width:767px){
  .gdpr-cookie-banner.gdpr-cookie-banner{left:12px!important;right:auto!important;bottom:12px!important;max-width:280px!important;width:auto!important;padding:10px 12px 10px 58px!important}
  .gdpr-cookie-banner .u-ck{width:44px;height:44px;margin-top:-22px;left:8px}
  .gdpr-cookie-banner .u-ck-title{font-size:15px}
}
@media (prefers-reduced-motion:reduce){.gdpr-cookie-banner.gdpr-cookie-banner,.gdpr-cookie-banner .u-ck *{animation:none!important}}
</style>
<script>
(function(){
  var SVG='<svg class="u-ck" viewBox="0 0 100 100" aria-hidden="true"><g class="u-ck-bob">'+
    '<path class="u-ck-arm" d="M80 52c8-4 12-12 10-20" fill="none" stroke="#2D2926" stroke-width="4" stroke-linecap="round"/>'+
    '<path d="M50 10a38 38 0 1 0 38 40 9 9 0 0 1-10-10 9 9 0 0 1-9-11 9 9 0 0 1-8-12A39 39 0 0 0 50 10z" fill="#E7A55A" stroke="#2D2926" stroke-width="4" stroke-linejoin="round"/>'+
    '<circle cx="30" cy="34" r="4.5" fill="#6B3F2A"/><circle cx="62" cy="70" r="5" fill="#6B3F2A"/><circle cx="26" cy="62" r="4" fill="#6B3F2A"/><circle cx="46" cy="80" r="3.5" fill="#6B3F2A"/><circle cx="72" cy="50" r="3" fill="#6B3F2A"/>'+
    '<ellipse class="u-ck-eye" cx="40" cy="48" rx="4" ry="5.5" fill="#2D2926"/><ellipse class="u-ck-eye" cx="58" cy="48" rx="4" ry="5.5" fill="#2D2926"/>'+
    '<circle cx="34" cy="58" r="4" fill="#D1555A" opacity=".55"/><circle cx="64" cy="58" r="4" fill="#D1555A" opacity=".55"/>'+
    '<path d="M42 60q7 7 14 0" fill="none" stroke="#2D2926" stroke-width="3.5" stroke-linecap="round"/>'+
    '</g><circle class="u-ck-crumb" cx="84" cy="34" r="2.5" fill="#E7A55A" stroke="#2D2926" stroke-width="1.5"/><circle class="u-ck-crumb c2" cx="78" cy="28" r="2" fill="#E7A55A" stroke="#2D2926" stroke-width="1.5"/></svg>';
  function dress(b){
    if(!b||b.__unit) return; b.__unit=true;
    b.insertAdjacentHTML('afterbegin',SVG);
    var t=b.querySelector('.disclaimer-text');
    if(t&&!b.querySelector('.u-ck-title')) t.insertAdjacentHTML('beforebegin','<span class="u-ck-title">Cookie?</span>');
    var a=b.querySelector('.sqs-cookie-banner-v2-accept span, .sqs-cookie-banner-v2-accept');
    if(a) a.textContent='OK';
    if(t) t.textContent='We use cookies to make the site work and give you the best experience.';
  }
  function scan(){ document.querySelectorAll('.gdpr-cookie-banner').forEach(dress); }
  scan();
  var mo=new MutationObserver(scan); mo.observe(document.documentElement,{childList:true,subtree:true});
  setTimeout(function(){ mo.disconnect(); }, 15000);
})();
</script>
